<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>A-Service</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f7f9fb;
            margin: 0;
            padding: 0;
        }
        .page {
            max-width: 720px;
            margin: 64px auto;
            padding: 32px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }
        h1 {
            margin-top: 0;
            color: #1f2937;
        }
        p {
            color: #4b5563;
        }
        .actions {
            display: flex;
            gap: 12px;
            margin: 20px 0;
        }
        button {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        button:active {
            transform: translateY(1px);
        }
        #login-btn {
            background: #2563eb;
            color: #fff;
            box-shadow: 0 6px 14px rgba(37, 99, 235, 0.25);
        }
        #logout-btn {
            background: #e5e7eb;
            color: #111827;
        }
        #logout-btn:disabled {
            cursor: not-allowed;
            opacity: 0.6;
            box-shadow: none;
        }
        pre {
            background: #0f172a;
            color: #e5e7eb;
            padding: 16px;
            border-radius: 10px;
            overflow: auto;
        }
    </style>
</head>
<body>
<main class="page">
    <h1>A-Service</h1>
    <p id="status">로그인 상태를 확인하는 중...</p>

    <div class="actions">
        <button id="login-btn">로그인</button>
        <button id="logout-btn" disabled>로그아웃</button>
    </div>

    <pre id="user-info">로그인 후 사용자/토큰 정보를 확인할 수 있습니다.</pre>
</main>

<script>
    const statusText = document.getElementById('status');
    const userInfo = document.getElementById('user-info');
    const loginBtn = document.getElementById('login-btn');
    const logoutBtn = document.getElementById('logout-btn');

    function setAuthUI(authenticated) {
        if (authenticated) {
            loginBtn.style.display = 'none';
            logoutBtn.style.display = 'inline-block';
            logoutBtn.disabled = false;
        } else {
            loginBtn.style.display = 'inline-block';
            logoutBtn.style.display = 'none';
            logoutBtn.disabled = true;
        }
    }

    loginBtn.addEventListener('click', () => {
        window.location.href = '/oauth2/authorization/keycloak';
    });

    logoutBtn.addEventListener('click', () => {
        window.location.href = '/logout';
    });

    const params = new URLSearchParams(window.location.search);
    let silentAttempted = params.get('error') === 'login_required' || params.get('login_required') === '1'; // 이전 prompt=none 실패 시 재시도 방지
    if (silentAttempted) {
        // 실패 파라미터는 UI 깔끔하게 제거
        window.history.replaceState({}, document.title, window.location.pathname);
    }

    async function loadUser() {
        try {
            const res = await fetch('/api/user', { headers: { 'Accept': 'application/json' } });
            const contentType = res.headers.get('content-type') || '';

            if (res.status === 401 && !silentAttempted) {
                silentAttempted = true;
                // 브라우저 전체 리다이렉트로 prompt=none 시도 (SSO 세션 있을 때만 통과)
                window.location.href = '/oauth2/authorization/keycloak?prompt=none';
                return;
            }

            if (!res.ok || !contentType.includes('application/json')) {
                throw new Error('unauthenticated');
            }

            silentAttempted = false;
            const data = await res.json();
            statusText.textContent = `${data.user}님으로 로그인되었습니다.`;
            userInfo.textContent = JSON.stringify(data, null, 2);
            setAuthUI(true);
        } catch (err) {
            statusText.textContent = '로그인이 필요합니다.';
            userInfo.textContent = '로그인 버튼을 눌러 Keycloak 인증을 진행하세요.';
            setAuthUI(false);
        }
    }

    setAuthUI(false);
    loadUser();
</script>
</body>
</html>
